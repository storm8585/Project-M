name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NDK_VERSION: '28.0.13004108'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:
  prepare:
    name: Validate and version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      core_ref: ${{ steps.version.outputs.core_ref }}
      go_version: ${{ steps.version.outputs.go_version }}
      abis: ${{ steps.abis.outputs.abis }}
      platforms: ${{ steps.abis.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper before building
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test CI helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Resolve target ABIs
        id: abis
        run: python3 .github/scripts/abis.py
      - name: Generate build version
        id: version
        run: python3 .github/scripts/version.py
      - name: Build summary
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          CORE_REF: ${{ steps.version.outputs.core_ref }}
          BUILD_ABIS: ${{ steps.abis.outputs.abis }}
        run: |
          {
            echo '## Android build'
            printf '\n- Version: `%s`\n- Version code: `%s`\n' "$VERSION_NAME" "$VERSION_CODE"
            printf -- '- App commit: `%s`\n- Core commit: `%s`\n' "$GITHUB_SHA" "$CORE_REF"
            printf -- '- ABIs: `%s`\n' "$BUILD_ABIS"
            echo '- Version changes are workspace-only; no bot commits or automatic releases.'
          } >> "$GITHUB_STEP_SUMMARY"

  native:
    name: Build libbox (API 24 + API 21)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      LIBBOX_PLATFORMS: ${{ needs.prepare.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore native libraries
        id: aar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/libs/libbox*.aar
          key: libbox-v2-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.core_ref }}-go${{ needs.prepare.outputs.go_version }}-ndk${{ env.NDK_VERSION }}-${{ needs.prepare.outputs.abis }}-${{ hashFiles('.github/workflows/android.yml', '.github/scripts/check_native.py', '.github/scripts/abis.py') }}
      - name: Check out pinned core
        if: steps.aar.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SagerNet/sing-box
          ref: ${{ needs.prepare.outputs.core_ref }}
          path: core
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 17 for gomobile
        if: steps.aar.outputs.cache-hit != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Go
        if: steps.aar.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.prepare.outputs.go_version }}
          cache-dependency-path: core/go.sum
      - name: Set up Android SDK
        if: steps.aar.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Install native toolchain
        if: steps.aar.outputs.cache-hit != 'true'
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0" "ndk;$NDK_VERSION"
      - name: Build both native libraries for selected ABIs
        if: steps.aar.outputs.cache-hit != 'true'
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          make lib_install
          export PATH="$(go env GOPATH)/bin:$PATH"
          go run ./cmd/internal/build_libbox -target android -platform "$LIBBOX_PLATFORMS"
          mkdir -p ../app/libs
          cp libbox.aar libbox-legacy.aar ../app/libs/
      - name: Verify native libraries (including cache hits)
        run: python3 .github/scripts/check_native.py
      - name: Share native libraries with Android jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/libs/libbox*.aar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  android:
    name: Android / ${{ matrix.flavor }}
    needs: [prepare, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: other
            task: Other
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate the same build version
        run: python3 .github/scripts/version.py
      - name: Set up Java 21 for Gradle
        # gomobile requires 17; Gradle uses 21 to avoid AGP 9.3.1's JDK 17 lint bug.
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Install application SDKs
        # The vendored libxposed-api module compiles against API 36.
        run: sdkmanager "platforms;android-37.1" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Download native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/libs
      - name: Prepare optional release signing (trusted default branch only)
        id: signing
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 .github/scripts/prepare_signing.py
      - name: Unit tests and APKs
        env:
          VARIANT: ${{ matrix.task }}${{ steps.signing.outputs.build_type || 'Debug' }}
        run: |
          bash ./gradlew --no-daemon --stacktrace --console=plain --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            ":app:test${VARIANT}UnitTest" ":app:assemble$VARIANT"
      - name: Package APKs, checksums and build metadata
        env:
          BUILD_TYPE: ${{ steps.signing.outputs.build_type || 'Debug' }}
          BUILD_FLAVOR: ${{ matrix.flavor }}
          CORE_REF: ${{ needs.prepare.outputs.core_ref }}
        run: python3 .github/scripts/package.py
      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Modex-${{ needs.prepare.outputs.version_name }}-${{ matrix.flavor }}-${{ steps.signing.outputs.build_type || 'Debug' }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload test reports and R8 mapping
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.flavor }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/mapping/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f app/release.keystore local.properties
